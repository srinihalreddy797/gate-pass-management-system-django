{% if page_obj and page_obj.paginator.num_pages > 1 %}
    <div class="mt-6 flex items-center justify-between">
        <p class="text-sm text-slate-500 dark:text-slate-400">
            Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
        </p>
        <div class="flex gap-2">
            {% if page_obj.has_previous %}
                <a href="?page={{ page_obj.previous_page_number }}{% if request.GET.search %}&search={{ request.GET.search }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status }}{% endif %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm dark:border-slate-700">Previous</a>
            {% endif %}
            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}{% if request.GET.search %}&search={{ request.GET.search }}{% endif %}{% if request.GET.status %}&status={{ request.GET.status }}{% endif %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm dark:border-slate-700">Next</a>
            {% endif %}
        </div>
    </div>
{% endif %}
